name: CI

# EP-0 · Engineering Foundations & Guardrails.
# Turns the frozen Foundation's invariant tests into an automated, required gate:
# any change that weakens an invariant fails here before it can be built upon.
# This job runs the pure-domain unit tests (the encoded Foundation) and the strict
# build. It enforces guarantees; it never interprets or changes them.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Invariants + strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: "Domain-core purity (Constitution: pure, UI-independent core)"
        run: npm run check:purity

      - name: Foundation guarantees — unit + invariant tests
        # src/domain/*.test.ts encode the Constitution and Trust Invariants
        # (forecast != proof, prediction != recovery, recovery != auditable,
        #  beneficiary never determines the number). A breach turns this red.
        run: npm run test

      - name: Strict build (type-checked)
        run: npm run build

  postgres-integration:
    name: EP-9 Postgres-backed verification
    # EP-9.1 · Runs the real governed-backend suites against an ephemeral, pinned
    # Postgres service container — the two DB-backed suites otherwise skip themselves
    # (describe.skipIf(!process.env.DATABASE_URL)) and never actually execute. This job
    # never touches the `verify` job above or its gates; it only adds a second,
    # independent gate. Credentials below are runner-local, test-only values fixed in
    # this file — never a GitHub secret, never anything resembling production access.
    runs-on: ubuntu-latest
    services:
      postgres:
        # No PostgreSQL version is specified anywhere else in this repository (schema/
        # migrations/docs); 16 is assumed as a currently-supported, conservative LTS
        # major version, pinned explicitly (never `latest`).
        image: postgres:16
        env:
          POSTGRES_USER: ep9_test
          POSTGRES_PASSWORD: ep9_test_only
          POSTGRES_DB: ep9_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ep9_test:ep9_test_only@localhost:5432/ep9_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Portable suite with Postgres available (executes the EP-9 governed-path test)
        # Same command as the `verify` job's test step — with DATABASE_URL now set, the
        # describe.skipIf(!HAS_DB) block in src/App.guidedDemo.test.ts executes instead
        # of skipping. No test file, skip condition, or assertion is changed here.
        run: npm run test

      - name: EP-2/EP-9 persistence suite (test:ep2)
        run: npm run test:ep2

  browser-journey:
    name: EP-19 Browser journey (UI -> API -> worker -> Postgres)
    # EP-19 · The gap this closes: `npm run test:e2e` existed but NO job ever invoked it, so the
    # only browser coverage in the repository was never actually run in CI. This job runs it, and
    # adds the governed journey — the one path a pilot actually walks, end to end, in a real
    # browser against a real API, a real worker loop and a real database.
    #
    # Two things about it are deliberate and easy to "tidy" into uselessness:
    #
    #   * `test:journey` drives the Vite DEV server, not a production build. `src/data/apiClient.ts`
    #     attaches development identity headers only under `import.meta.env.DEV`, so against a
    #     production bundle every governed call arrives unauthenticated and 401s. Switching this to
    #     `vite preview` would not make the journey stricter, it would stop it reaching the API.
    #   * The worker is enabled with NH_PILOT_ASSESSMENT_AGENT_ENABLED and NO admission-policy
    #     registry. The assessment agent publishes no candidates, so (per EP-18) it needs none, and
    #     inventing a RecoveryType:threshold pair to satisfy an over-broad guard would put a
    #     fabricated number into the configuration of the very suite that exists to forbid them.
    #
    # Credentials below are runner-local, test-only values fixed in this file — never a GitHub
    # secret, never anything resembling production access. All data is synthetic by construction.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ep19_test
          POSTGRES_PASSWORD: ep19_test_only
          POSTGRES_DB: ep19_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ep19_test:ep19_test_only@localhost:5432/ep19_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Install Chromium for Playwright
        # The development sandbox has Chromium pre-installed at /opt/pw-browsers/chromium; a CI
        # runner does not, and both harnesses fall back to Playwright's managed browser when that
        # path is absent. Only the browser is fetched, not the whole bundled toolchain.
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: EP-19 governed pilot journey (real browser, real API, real worker)
        run: npm run test:journey

      # NOT WIRED: `npm run test:e2e` (e2e/smoke.mjs).
      #
      # The intent was to wire it in here, since no job had ever invoked it. It turns out it has been
      # broken since EP-13, and reproduces identically at this branch's base (b82c151d) — so it is a
      # pre-existing failure, not a regression from this branch. Adding it would simply make CI red.
      #
      # The cause is not a small one. `smoke.mjs` drives `vite preview` against a static build with no
      # server, and since EP-13 the upload path cannot proceed until the SERVER has validated and
      # admitted the dataset. Its premise — a browser-only flow that needs no backend — no longer
      # describes the product.
      #
      # It also cannot be fixed by pointing it at the API. Its fixtures are two rows, so admission
      # would have to be granted by a bar with minAcceptedRows: 1 and minCoverageDays: 0 — a permissive
      # threshold invented for no reason except to make a test pass. That is the exact habit this
      # repository forbids, and it would be worse than a skipped test, because it would look green.
      #
      # So it is left out deliberately and visibly. Rewriting it against the API belongs with the
      # per-case browser matrix (the next branch); the governed journey above covers the happy path it
      # was originally guarding.

  docker-pilot-smoke:
    name: EP-10 Docker pilot smoke test
    # EP-10 · Real containerized verification that the sandbox this branch was developed in
    # could not perform itself (outbound image pulls to Docker Hub's CDN are blocked by that
    # sandbox's network policy — a documented environment limitation, not a code defect).
    # Builds the actual committed Dockerfile, brings the stack up via the actual committed
    # docker-compose.yml (its already-committed, clearly-labeled local pilot placeholder
    # credentials — no GitHub secret, nothing resembling production access), and curls the
    # running container from the runner. Independent of `verify` and `postgres-integration`
    # above; touches no product/domain code, no test, no schema, no assertion.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the pilot stack
        # --wait blocks (up to --wait-timeout) on docker-compose.yml's own dependency graph —
        # db's health check and migrate's service_completed_successfully — before returning.
        # The app container has no Docker-level health check (EP-10 deliberately didn't add
        # one to the Dockerfile/compose; this workflow is the smallest addition asked for), so
        # the next step separately polls its real HTTP endpoint before any check runs.
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Wait for the app to answer HTTP (bounded)
        run: |
          set -eu
          deadline=$((SECONDS + 120))
          until curl -sf -o /dev/null http://127.0.0.1:4000/health; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::app did not answer /health within 120s"
              exit 1
            fi
            sleep 3
          done
          echo "app is answering HTTP"

      - name: Verify /health returns 200
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health)
          if [ "$code" != "200" ]; then
            echo "::error::/health returned $code, expected 200"
            exit 1
          fi

      - name: Verify the SPA root is served
        run: |
          set -eu
          resp=$(curl -s -w '\n%{http_code}' http://127.0.0.1:4000/)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "::error::/ returned $code, expected 200"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '<div id="root">'; then
            echo "::error::/ did not return the built SPA shell"
            exit 1
          fi

      - name: Verify an unauthenticated /api/* request reaches Fastify (401)
        # Proves /api/* is routed into the real governed API (actorFromRequest rejects it),
        # not swallowed by the static layer or the SPA fallback — a fabricated 200 here would
        # be worse than a failure.
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/cases/RE-1014/proofs)
          if [ "$code" != "401" ]; then
            echo "::error::unauthenticated /api/* returned $code, expected 401"
            exit 1
          fi

      - name: Verify an unknown /api/* route returns JSON 404 (never the SPA shell)
        run: |
          set -eu
          resp=$(curl -s -w '\n%{http_code}' http://127.0.0.1:4000/api/this-route-does-not-exist)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" != "404" ]; then
            echo "::error::unknown /api/* returned $code, expected 404"
            exit 1
          fi
          if printf '%s' "$body" | grep -qi '<!doctype html'; then
            echo "::error::unknown /api/* returned the SPA shell, expected JSON"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"error"'; then
            echo "::error::unknown /api/* body was not the expected JSON error shape"
            exit 1
          fi

      - name: Verify a missing static asset returns JSON 404 (never the SPA shell)
        # NOTE: each condition here uses an explicit if/fi, not `grep ... && { exit 1; }` — under
        # `set -e`, a `&&`-guarded block as the LAST command of a script is not exempt from -e
        # just because it is the right-hand side of `&&`: if the left-hand command (grep) is the
        # one that ends up determining the whole statement's exit status (i.e. it finds no match,
        # so the right-hand side never runs), and this is the final statement in the script, that
        # non-zero status aborts the step even though "no match" is the PASSING outcome here. This
        # bit the first version of this job (CI run 33596662848): this exact check failed with no
        # output at all, even though the app's behavior was already independently proven correct
        # both by server/productionServer.test.ts (run against real Postgres in the
        # postgres-integration job) and by direct manual verification. An `if` condition's test
        # expression is always exempt from `set -e`, regardless of position, so it doesn't have
        # this hazard.
        run: |
          set -eu
          resp=$(curl -s -w '\n%{http_code}' http://127.0.0.1:4000/assets/this-file-does-not-exist.js)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" != "404" ]; then
            echo "::error::missing static asset returned $code, expected 404"
            exit 1
          fi
          if printf '%s' "$body" | grep -qi '<!doctype html'; then
            echo "::error::missing static asset returned the SPA shell, expected JSON"
            exit 1
          fi

      - name: Verify an unknown UI route returns the SPA shell (client-side route refresh)
        run: |
          set -eu
          resp=$(curl -s -w '\n%{http_code}' http://127.0.0.1:4000/queue/some-case-id)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "::error::unknown UI route returned $code, expected 200"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '<div id="root">'; then
            echo "::error::unknown UI route did not return the SPA shell"
            exit 1
          fi

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
